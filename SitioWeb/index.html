<!DOCTYPE html>
<html>
<head>
    <title>TourData Connect</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <div class="control-panel-layers">
        <h3>Panel de Capas</h3>
        <div>
            <input type="checkbox" id="check-ruta" checked>
            <label for="check-ruta">Ruta (Peor Caso)</label>
        </div>
	<div>
            <input type="checkbox" id="check-ruta-resiliente" checked>
            <label for="check-ruta-resiliente">Ruta (Resiliente)</label>
        </div>
        <div>
            <input type="checkbox" id="check-antenas" checked>
            <label for="check-antenas">Antenas (Metadata)</label>
        </div>
	<div>
            <input type="checkbox" id="check-antenas-saturadas" checked>
            <label for="check-antenas-saturadas">Antenas Saturadas (Amenaza)</label>
        </div>
        <div>
            <input type="checkbox" id="check-amenazas" checked>
            <label for="check-amenazas">Amenazas (Clima)</label>
	</div>
	<div>
    	    <input type="checkbox" id="check-ruta-contingencia" checked>
            <label for="check-ruta-contingencia">Ruta (Contingencia)</label>
	</div>
	<div>
   	    <input type="checkbox" id="check-ruta-ksp" checked>
    	    <label for="check-ruta-ksp">k-Rutas Alternativas (Meta)</label>
	</div>
	<div>
    	    <input type="checkbox" id="check-ruta-cplex" checked>
    	    <label for="check-ruta-cplex">Ruta CPLEX (Placeholder)</label>
	</div>
	<div>
    	    <input type="checkbox" id="check-fallas" checked>
    	    <label for="check-fallas">Fallas Simuladas</label>
	</div>
	</div>
    </div>

    <div class="control-panel-routing">
        <h3>Calcular Ruta</h3>
        <div class="route-input">
            <label for="start-point">Inicio:</label>
            <input type="text" id="start-point" placeholder="Usar mi ubicación actual...">
            <button id="geolocate-btn">📍</button>
        </div>
        <div class="route-input">
            <label for="end-point">Destino:</label>
            <input type="text" id="end-point" placeholder="Ingresa una dirección...">
        </div>
        <button id="calculate-route-btn">Calcular Ruta</button>
	<button id="contingency-route-btn">Calcular Ruta (Contingencia)</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
